# NotProton 的 runner variant 設定（~/Library/Application Support/notproton/variants/steamac.conf 的副本）。
# 啟動選項用 NOTPROTON_RUNNER_VARIANT=steamacfex+steamackk+steamacadv+steamacvproc 點名才生效。
# 下面 label 是安裝當時寫的；steamacfex 目前裝的是 steamac-darwin c33b6a5e9（熱頁）編的 xtajit64.dll。
[steamacfex]
label   = 自編 FEX（steamac-darwin 99fe1f496＋STEAMAC_EXCLOG 診斷）
variant = steamac FEX
src     = Library/Application Support/notproton/steamac/fex
dst     = lib/wine
build   = 27.0.0.41073-fex
remove  = aarch64-unix/libarm64ecfex.so

[steamackk]
label   = Vulkan loader 1.4.363（給 KosmicKrisp）
variant = steamac Vulkan
src     = Library/Application Support/notproton/steamac/vkloader
dst     = lib/aarch64
build   = 27.0.0.41073-fex

[steamacadv]
label   = advapi32（上游 Wine 11.17 原始碼＋CredEnumerateW 修正＋CW Hack 12735，patches/wine/advapi32-steamac.patch）
variant = steamac advapi32
src     = Library/Application Support/notproton/steamac/advapi32
dst     = lib/wine
build   = 27.0.0.41073-fex

[steamacvproc]
label   = msvproc（上游 Wine 11.17 原始碼＋ARM64EC yuv2rgb 暫存器修正，patches/wine/msvproc-arm64ec-yuv2rgb.patch）
variant = steamac msvproc
src     = Library/Application Support/notproton/steamac/msvproc
dst     = lib/wine
build   = 27.0.0.41073-fex
