# msfs2024-steamac：vkd3d-proton 3.0b＋DXVK 3.0.2 跑在 KosmicKrisp 上
[NOTPROTON_STEAMAC]
label       = steamac D3D12（vkd3d-proton＋KosmicKrisp）
description = vkd3d-proton 3.0b、DXVK 3.0.2 放進 system32，Vulkan 指到 KosmicKrisp。要搭配 steamac Vulkan variant。
stage       = Library/Application Support/notproton/steamac/d3d
overrides   = d3d12,d3d12core,dxgi,d3d11,d3d10core=n,b
env         = VK_DRIVER_FILES=~/Library/Application Support/notproton/steamac/kk/kosmickrisp_icd.json
env         = VKD3D_FEATURE_LEVEL=12_1
env         = VKD3D_SHADER_MODEL=6_7
env         = DXVK_CONFIG=dxgi.maxDeviceMemory = 16384; dxgi.maxSharedMemory = 8192
tools       = notproton-fex-*
